<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Моя Роза">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Моя Роза — истории</title>
<style>
  :root{
    --accent:#D24E76; --accent-soft:#E0759A;
    --go:#12925A; --go-hi:#16A768;
    --sans:'Raleway',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --serif:'Lora',Georgia,'Times New Roman',serif;
    --safe-top:env(safe-area-inset-top,10px);
    --safe-bot:env(safe-area-inset-bottom,12px);
    --glass:rgba(22,18,17,.72);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{height:100%;background:#0c0a09;overflow:hidden;}
  body{font-family:var(--sans);color:#fff;position:fixed;inset:0;}
  img,video{display:block;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  @media (prefers-reduced-motion:reduce){.seg i{animation:none!important;}.panel.anim{transition:none!important;}}

  .stage{position:absolute;inset:0;overflow:hidden;background:#0c0a09;}
  .deck{position:absolute;inset:0;perspective:1600px;perspective-origin:50% 50%;}
  /* настоящий 3D-куб: грани на общей оси */
  .cube{position:absolute;inset:0;transform-style:preserve-3d;transform:translateZ(-50vw);}
  .cube.anim{transition:transform .52s cubic-bezier(.42,0,.28,1);}
  .cube.to-next{transform:translateZ(-50vw) rotateY(-90deg);}
  .cube.to-prev{transform:translateZ(-50vw) rotateY(90deg);}

  .panel{position:absolute;inset:0;overflow:hidden;background:#0c0a09;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  .panel.front{transform:rotateY(0deg) translateZ(50vw);}
  .panel.right{transform:rotateY(90deg) translateZ(50vw);}
  .panel.left{transform:rotateY(-90deg) translateZ(50vw);}
  .panel.freeze .seg.run i{animation-play-state:paused;}
  .panel .dark{position:absolute;inset:0;z-index:8;background:#000;opacity:0;transition:opacity .5s;pointer-events:none;}
  .panel.right .dark,.panel.left .dark{opacity:.5;}

  .photo{position:absolute;inset:0;z-index:0;}
  .photo .bg{position:absolute;inset:0;overflow:hidden;}
  .photo .bg>img,.photo .bg>video{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(30px) brightness(.5) saturate(1.15);}
  .photo .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
  .panel.comp .photo .fg{object-fit:cover;}
  .photo .grain{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,10,9,.55)0%,rgba(12,10,9,0)20% 46%,rgba(12,10,9,.9)100%);}

  .zones{position:absolute;inset:0;z-index:3;display:flex;}
  .zones .z{flex:1;}
  .zones .zl{flex:0 0 32%;}

  /* прогресс: плоские тонкие линии, заливка масштабом (crisp, без «пилюль») */
  .prog{position:absolute;top:0;left:0;right:0;z-index:7;display:flex;align-items:flex-start;gap:3px;
    box-sizing:border-box;padding:calc(var(--safe-top) + 12px) 12px 0;font-size:0;line-height:0;pointer-events:none;}
  .prog .seg{position:relative;flex:1 1 0;min-width:0;height:2px;background:rgba(255,255,255,.26);overflow:hidden;}
  .prog .seg i{position:absolute;top:0;left:0;width:100%;height:2px;background:#fff;transform:scaleX(0);transform-origin:left center;}
  .prog .seg.done i{transform:scaleX(1);}
  .prog .seg.run i{animation:fill var(--dur,6s) linear forwards;}
  .stage.paused .seg.run i{animation-play-state:paused;}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  .rail{position:absolute;right:10px;top:52%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;gap:10px;align-items:center;}
  .rail button{width:46px;height:46px;border-radius:16px;border:1px solid rgba(255,255,255,.3);
    background:linear-gradient(155deg,rgba(255,255,255,.28),rgba(255,255,255,.06));
    backdrop-filter:blur(22px) saturate(200%);-webkit-backdrop-filter:blur(22px) saturate(200%);
    color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:8.5px;font-weight:500;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -6px 12px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.18);
    transition:transform .15s,background .2s;text-shadow:0 1px 3px rgba(0,0,0,.45);}
  .rail button:active{transform:scale(.92);background:linear-gradient(155deg,rgba(255,255,255,.4),rgba(255,255,255,.14));}
  .rail button svg{width:20px;height:20px;stroke-width:1.6;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));}
  .rail .heart svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;}
  .rail .heart.on{background:#fff;}
  .rail .heart.on svg{fill:var(--accent);stroke:var(--accent);}
  .rail .heart.pop{animation:pop .42s cubic-bezier(.2,1.4,.5,1);}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.26)}100%{transform:scale(1)}}

  .cap{position:absolute;left:0;right:64px;bottom:0;z-index:6;padding:16px 18px calc(var(--safe-bot) + 16px);}
  .cap .name{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1;letter-spacing:-.01em;text-shadow:0 2px 18px rgba(0,0,0,.6);text-wrap:balance;}
  .cap .tags{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:11.5px;font-weight:500;letter-spacing:.03em;opacity:.86;text-shadow:0 1px 10px rgba(0,0,0,.6);}
  .cap .tags i{width:3px;height:3px;border-radius:50%;background:var(--accent-soft);font-style:normal;opacity:.9;}
  .cap .descwrap{margin-top:8px;font-size:13px;line-height:1.45;max-width:96%;text-shadow:0 1px 10px rgba(0,0,0,.75);}
  .cap .desc2{max-height:1.45em;overflow:hidden;opacity:.92;transition:max-height .34s ease;
    -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent);mask-image:linear-gradient(180deg,#000 55%,transparent);}
  .cap .descwrap.open .desc2{max-height:42vh;-webkit-mask-image:none;mask-image:none;}
  .cap .occ{display:none;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .cap .descwrap.open .occ{display:flex;}
  .cap .occ span{font-size:11px;font-weight:500;color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 10px;background:rgba(0,0,0,.22);}
  .cap .detail{display:none;margin-top:12px;}
  .cap .descwrap.open .detail{display:block;}
  .cap .specs2{display:flex;gap:18px;margin-bottom:8px;}
  .cap .specs2 span{font-size:14px;font-weight:700;}
  .cap .specs2 i{display:block;font-style:normal;font-size:10.5px;font-weight:500;opacity:.62;margin-bottom:2px;letter-spacing:.02em;}
  .cap .compose2 .crow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;border-top:1px solid rgba(255,255,255,.14);}
  .cap .compose2 i{font-style:normal;opacity:.92;}
  .cap .compose2 b{font-weight:600;opacity:.68;white-space:nowrap;}
  .cfglabel{font-size:12px;color:rgba(255,255,255,.55);margin:16px 0 9px;letter-spacing:.02em;}
  .cfglabel:first-of-type{margin-top:2px;}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap;}
  .cfgchip{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;color:#fff;}
  .cfgchip.sel{border-color:var(--accent);background:rgba(210,78,118,.18);}
  .simgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .simcard{text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;overflow:hidden;padding:0 0 11px;color:#fff;}
  .simcard:active{transform:scale(.97);border-color:var(--accent);}
  .simcard img{width:100%;height:132px;object-fit:cover;margin-bottom:9px;}
  .simcard b{display:block;font-family:var(--serif);font-size:14px;font-weight:600;padding:0 11px;line-height:1.18;margin-bottom:4px;}
  .simcard span{padding:0 11px;font-size:13.5px;font-weight:700;}
  .cap .desc2{max-height:2.9em;overflow:hidden;opacity:.9;transition:max-height .34s ease,opacity .3s ease;
    -webkit-mask-image:linear-gradient(180deg,#000 62%,transparent);mask-image:linear-gradient(180deg,#000 62%,transparent);}
  .cap .descwrap.open .desc2{max-height:44vh;-webkit-mask-image:none;mask-image:none;}
  .cap .size{font-size:12.5px;margin-top:10px;font-weight:500;opacity:.9;}
  .cap .size b{color:#fff;font-weight:700;}
  .cap .price{display:flex;align-items:baseline;gap:9px;margin-top:12px;}
  .cap .now{font-size:22px;font-weight:700;letter-spacing:-.01em;}
  .cap .old{font-size:13px;opacity:.55;text-decoration:line-through;}
  .cap .off{font-size:10.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.16);padding:3px 7px;border-radius:7px;}
  .order{position:absolute;right:16px;bottom:calc(var(--safe-bot) + 22px);z-index:6;overflow:hidden;
    font-weight:700;font-size:15px;color:#fff;background:var(--go);padding:14px 22px;border-radius:14px;
    box-shadow:0 8px 24px -8px rgba(18,146,90,.85);transition:transform .15s,filter .15s,box-shadow .3s;}
  .order:active{transform:translateY(1px) scale(.97);filter:brightness(1.08);}
  .order.pulse{animation:oglow 2s ease-in-out infinite;}
  @keyframes oglow{
    0%,100%{transform:scale(1);box-shadow:0 8px 24px -8px rgba(18,146,90,.85),0 0 0 0 rgba(52,211,140,.55);}
    50%{transform:scale(1.05);box-shadow:0 12px 32px -6px rgba(18,146,90,1),0 0 26px 7px rgba(52,211,140,.6);}
  }
  .order.pulse::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
    background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.55) 50%,transparent 66%);
    transform:translateX(-130%);animation:sheen 2s ease-in-out infinite;}
  @keyframes sheen{0%{transform:translateX(-130%)}55%,100%{transform:translateX(130%)}}
  .cap .trust{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;font-weight:500;opacity:.82;text-shadow:0 1px 8px rgba(0,0,0,.7);}
  .cap .trust svg{width:13px;height:13px;stroke:#7fe0ab;flex:0 0 auto;}
  /* CTA-триггер на паузе последнего кадра */
  .endcta{position:absolute;left:14px;right:14px;bottom:118px;z-index:9;max-width:492px;margin:0 auto;
    background:var(--glass);backdrop-filter:blur(20px) saturate(1.2);color:#fff;border:1px solid rgba(255,255,255,.12);
    border-radius:20px;padding:16px 16px 14px;box-shadow:0 18px 46px -14px rgba(0,0,0,.6);
    transform:translateY(18px);opacity:0;pointer-events:none;transition:.34s;}
  .endcta.show{transform:translateY(0);opacity:1;pointer-events:auto;}
  .endcta p{font-size:14px;margin-bottom:12px;}
  .endcta p b{font-family:var(--serif);font-weight:600;}
  .endcta .row2{display:flex;gap:8px;}
  .endcta .buy{flex:1;font-weight:800;font-size:15px;color:#fff;background:var(--go);padding:13px;border-radius:12px;box-shadow:0 8px 22px -10px rgba(18,146,90,.9);}
  .endcta .skip{font-weight:600;font-size:14px;color:rgba(255,255,255,.65);padding:13px 14px;}
  .buyrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:14px;}
  .buyrow span{color:rgba(255,255,255,.7);} .buyrow b{font-weight:700;}
  .delv{display:flex;flex-direction:column;gap:8px;margin:16px 0 4px;}
  .delopt{text-align:left;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);border-radius:12px;padding:13px 15px;font-size:13.5px;font-weight:500;color:#fff;}
  .delopt.sel{border-color:var(--go);background:rgba(18,146,90,.16);}
  .buycta{margin-top:18px;width:100%;font-weight:800;font-size:16px;color:#fff;background:var(--go);padding:16px;border-radius:14px;box-shadow:0 8px 24px -10px rgba(18,146,90,.9);}
  .buycta:active{filter:brightness(1.08);}
  .fine{margin-top:12px;font-size:11.5px;color:rgba(255,255,255,.5);text-align:center;line-height:1.4;}
  .done{text-align:center;padding:14px 6px 4px;}
  .done .okc{width:64px;height:64px;border-radius:50%;background:var(--go);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .done .okc svg{width:32px;height:32px;stroke:#fff;stroke-width:2.5;}
  .done h3{margin-bottom:8px;}

  /* fixed chrome above cube */
  .topfixed{position:absolute;left:0;right:0;top:0;z-index:9;pointer-events:none;
    padding:calc(var(--safe-top) + 22px) 14px 0;display:flex;align-items:center;justify-content:space-between;}
  .topfixed>*{pointer-events:auto;}
  .brand{font-family:var(--serif);font-weight:600;font-size:17px;text-shadow:0 1px 12px rgba(0,0,0,.6);}
  .brand b{color:var(--accent-soft);}
  .topr{display:flex;align-items:center;gap:10px;}
  .saved{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:rgba(20,18,16,.34);backdrop-filter:blur(8px);padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.14);}
  .saved svg{width:15px;height:15px;fill:var(--accent-soft);}
  .xclose{width:34px;height:34px;border-radius:50%;background:rgba(20,18,16,.34);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.14);}
  .xclose svg{width:16px;height:16px;stroke:#fff;stroke-width:2.2;}
  .hintpaused{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9;background:rgba(20,18,16,.6);backdrop-filter:blur(8px);padding:8px 14px;border-radius:999px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;border:1px solid rgba(255,255,255,.14);}
  .stage.paused .hintpaused{opacity:1;}
  .railhint{position:absolute;right:64px;top:50%;transform:translateY(-50%) translateX(10px);z-index:8;max-width:170px;
    background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);border:1px solid rgba(255,255,255,.18);border-radius:14px;
    padding:10px 12px;font-size:12.5px;line-height:1.35;color:#fff;box-shadow:0 12px 30px -10px rgba(0,0,0,.6);
    opacity:0;pointer-events:none;transition:.32s;}
  .railhint.show{opacity:1;transform:translateY(-50%) translateX(0);}
  .railhint::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%) rotate(45deg);width:12px;height:12px;
    background:var(--glass);border-right:1px solid rgba(255,255,255,.18);border-top:1px solid rgba(255,255,255,.18);}
  .rail button.hintpulse{animation:railpulse 1.5s ease-in-out 3;}
  @keyframes railpulse{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 7px rgba(255,255,255,.22)}}

  /* sheets */
  .scrim{position:fixed;inset:0;z-index:20;background:rgba(12,10,9,.5);opacity:0;pointer-events:none;transition:opacity .28s;}
  .scrim.show{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin:0 auto;background:var(--glass);backdrop-filter:blur(24px) saturate(1.2);color:#fff;border:1px solid rgba(255,255,255,.1);border-bottom:none;border-radius:24px 24px 0 0;padding:8px 20px calc(var(--safe-bot) + 18px);transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.8,.2,1);max-height:82%;overflow-y:auto;}
  .sheet.show{transform:translateY(0);}
  .grip{width:36px;height:4px;border-radius:3px;background:rgba(255,255,255,.28);margin:8px auto 16px;}
  .sheet h3{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:4px;}
  .sheet .sub{font-size:12.5px;color:rgba(255,255,255,.6);margin-bottom:18px;}
  .sheet.full{top:0;height:100%;max-height:100%;border-radius:0;border:none;padding-top:calc(var(--safe-top) + 12px);}
  .sheet .pagehead{display:flex;align-items:center;gap:12px;margin:2px 0 18px;}
  .sheet .pagehead .x{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .sheet .pagehead .x svg{width:16px;height:16px;stroke:#fff;stroke-width:2.2;}
  .sheet .pagehead h3{margin:0;}
  .sizes{display:flex;flex-direction:column;gap:10px;}
  .sizeopt{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);border-radius:16px;padding:14px 16px;}
  .sizeopt .big{font-family:var(--serif);font-size:18px;font-weight:600;}
  .sizeopt .big span{color:rgba(255,255,255,.62);font-family:var(--sans);font-size:12.5px;font-weight:500;}
  .sizeopt .p{font-weight:700;font-size:16px;text-align:right;}
  .sizeopt .p small{display:block;font-weight:500;font-size:11px;color:rgba(255,255,255,.42);text-decoration:line-through;}
  .sizeopt.sel{border-color:var(--accent);background:rgba(210,78,118,.16);}
  .sizeopt .tick{width:21px;height:21px;border-radius:50%;border:2px solid rgba(255,255,255,.28);flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .sizeopt.sel .tick{border-color:var(--accent);background:var(--accent);}
  .sizeopt .tick svg{width:12px;height:12px;stroke:#fff;display:none;}
  .sizeopt.sel .tick svg{display:block;}
  .row{display:flex;align-items:center;gap:12px;}
  .swatches{display:flex;flex-wrap:wrap;gap:14px;}
  .swatch{display:flex;flex-direction:column;align-items:center;gap:7px;width:62px;}
  .swatch .dot{width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 0 0 3px rgba(20,18,17,.55);}
  .swatch span{font-size:11px;color:rgba(255,255,255,.72);font-weight:500;text-align:center;}
  .swatch.sel .dot{box-shadow:inset 0 0 0 3px rgba(20,18,17,.55),0 0 0 2px var(--accent);border-color:transparent;}
  .compose{list-style:none;}
  .compose li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:14px;}
  .compose li:last-child{border-bottom:none;}
  .compose li b{margin-left:auto;color:rgba(255,255,255,.62);font-weight:600;}
  .compose .ic{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .compose .ic svg{width:17px;height:17px;stroke:var(--accent-soft);}
  .sheetcta{margin-top:20px;width:100%;font-weight:700;font-size:15px;color:#fff;background:var(--accent);padding:15px;border-radius:14px;}
  .specs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
  .specs>div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 8px;text-align:center;}
  .specs>div span{display:block;font-size:11px;color:rgba(255,255,255,.55);margin-bottom:4px;}
  .specs>div b{font-family:var(--serif);font-size:16px;font-weight:600;}
  .about{font-size:14px;line-height:1.5;color:rgba(255,255,255,.9);margin-bottom:18px;}
  .occ-title{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:10px;}
  .chips2{display:flex;flex-wrap:wrap;gap:8px;}
  .chips2 span{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:500;}

  .summary{position:absolute;inset:0;z-index:12;background:linear-gradient(180deg,#241f1c,#0c0a09);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px;}
  .summary.show{display:flex;}
  .summary .crown{width:52px;height:52px;color:var(--accent-soft);margin-bottom:18px;}
  .summary h2{font-family:var(--serif);font-size:28px;font-weight:600;margin-bottom:10px;}
  .summary p{font-size:14px;opacity:.82;margin-bottom:24px;line-height:1.45;max-width:280px;}
  .summary .thumbs{display:flex;gap:10px;margin-bottom:26px;flex-wrap:wrap;justify-content:center;}
  .summary .thumbs img{width:60px;height:80px;object-fit:cover;border-radius:12px;border:1.5px solid rgba(255,255,255,.2);}
  .summary .cnt{color:var(--accent-soft);font-weight:700;}
  .summary .go{font-weight:700;font-size:15px;color:#fff;background:var(--accent);padding:14px 30px;border-radius:15px;}
  .summary .back{margin-top:16px;color:rgba(255,255,255,.55);font-size:13px;}

const svg=(p,f='none',s='currentColor')=>`<svg viewBox="0 0 24 24" fill="${f}" stroke="${s}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

const deck=document.getElementById('deck'), cube=document.getElementById('cube'), progEl=document.getElementById('prog'), stage=document.getElementById('stage'), summaryEl=document.getElementById('summary');
let cur=0, sub=0, paused=false, transitioning=false, activePanel=null, likes=0, sheetOpen=false;
let openedControl=false, views=0, hintShown=false, railPulsed=false;
const railhintEl=document.getElementById('railhint');
function showRailHint(){ if(hintShown||!B[cur].sizes||sheetOpen)return; hintShown=true; railhintEl.classList.add('show'); setTimeout(hideRailHint,4500); }
function hideRailHint(){ railhintEl.classList.remove('show'); }
function pulseRail(){ if(railPulsed||openedControl)return; railPulsed=true; const b=activePanel&&activePanel.querySelector('.rail button:nth-child(2)'); if(b)b.classList.add('hintpulse'); }

function mediaHTML(ph){
  const one=(cls)=> ph.type==='video'
    ? `<video class="${cls}" src="${ph.src}" muted loop playsinline autoplay preload="auto"></video>`
    : `<img class="${cls}" src="${ph.src}" alt="">`;
  return `<div class="bg">${one('')}</div>${one('fg')}<div class="grain"></div>`;
}
function progHTML(i,s){ return photosOf(i).map((_,k)=>`<div class="seg ${k<s?'done':''} ${k===s?'run':''}"><i></i></div>`).join(''); }

function renderPanel(i,s){
  const b=B[i];
  const p=document.createElement('div'); p.className='panel'+(b.comp?' comp':'');
  const tags=(b.tags&&b.tags.length)?`<div class="tags">${b.tags.map(t=>`<span>${t}</span>`).join('<i></i>')}</div>`:'';
  const rail=b.sizes?`<div class="rail">
      <button class="heart ${st[i].liked?'on':''}" data-heart>${svg(IC.heartF)}</button>
      ${b.comp?'':`<button data-sheet="size">${svg(IC.ruler)}Размер</button>`}
      <button data-sheet="similar">${svg(IC.grid)}Похожие</button>
    </div>`:'';
  const cap=b.sizes?`<div class="cap">
      <div class="name">${b.name}</div>${tags}
      <div class="descwrap" data-more><div class="desc2">${b.desc}</div><div class="detail dt"></div></div>
      <div class="size sz"></div><div class="price pr"></div>
      <div class="trust">${svg('<path d="M3 13V7a1 1 0 0 1 1-1h10v9M14 9h4l3 3v3h-2M5 17h9"/><circle cx="7.5" cy="17.5" r="1.6"/><circle cx="17.5" cy="17.5" r="1.6"/>','none','#7fe0ab')} Доставка по Москве за 2 часа · Roza4U</div>
    </div><button class="order" data-order>Заказать</button>`
    :`<div class="cap"><div class="name">${b.name}</div><div class="descwrap"><span class="desc2">${b.desc}</span></div></div>`;
  p.innerHTML=`<div class="photo">${mediaHTML(photosOf(i)[s])}</div>
    <div class="dark"></div>
    <div class="zones"></div>${rail}${cap}`;
  return p;
}

function fillPrice(p,i){
  if(!cfgs(i).length)return;
  const c=curc(i);
  const sz=p.querySelector('.sz'); if(sz) sz.innerHTML=B[i].comp?'':`<b>${c.n}</b> роз · ${c.cm} см`;
  const off=Math.round((1-c.price/c.old)*100);
  const pr=p.querySelector('.pr'); if(pr) pr.innerHTML=`<span class="now">${rub(c.price)}</span><span class="old">${rub(c.old)}</span><span class="off">−${off}%</span>`;
  const dt=p.querySelector('.dt'); if(dt) dt.innerHTML=detailHTML(i);
}
function playVid(p){ const v=p.querySelector('video.fg')||p.querySelector('video'); if(v){v.muted=true;const r=v.play&&v.play(); if(r&&r.catch)r.catch(()=>{});} }
function buildProg(){
  const ph=photosOf(cur);
  progEl.innerHTML=ph.map((_,k)=>`<div class="seg ${k<sub?'done':''} ${k===sub?'run':''}"><i></i></div>`).join('');
  const bar=progEl.querySelector('.seg.run i');
  if(bar){ const dur=ph[sub].type==='video'?8:5; progEl.style.setProperty('--dur',dur+'s');
    bar.addEventListener('animationend',()=>{ if(!transitioning) autoAdvance(); },{once:true}); }
}
function wirePanel(p){
  const z=p.querySelector('.zones');
  z.addEventListener('pointerdown',onDown,{passive:true});
  z.addEventListener('pointermove',onMove,{passive:true});
  z.addEventListener('pointerup',onUp,{passive:true});
  z.addEventListener('pointercancel',()=>{clearTimeout(holdT);resume();},{passive:true});
  const hb=p.querySelector('[data-heart]'); if(hb) hb.addEventListener('click',()=>like(hb),{passive:true});
  p.querySelectorAll('[data-sheet]').forEach(b=>b.addEventListener('click',()=>openSheet(b.dataset.sheet),{passive:true}));
  const mb=p.querySelector('[data-more]'); if(mb) mb.addEventListener('click',()=>toggleDesc(p),{passive:true});
  const ob=p.querySelector('[data-order]'); if(ob) ob.addEventListener('click',()=>openSheet('buy'),{passive:true});
  fillPrice(p,cur); buildProg(); playVid(p);
  if(B[cur].sizes && !hintShown) setTimeout(showRailHint,1400);
  if(views>=4 && !openedControl && !railPulsed) setTimeout(pulseRail,700);
}

function stepWithin(newSub){
  sub=newSub; paused=false; stage.classList.remove('paused');
  const p=activePanel;
  p.querySelector('.photo').innerHTML=mediaHTML(photosOf(cur)[sub]);
  buildProg(); playVid(p);
}

function transitionTo(k,dir){
  if(k<0){ stepWithin(0); return; }
  if(k>=B.length){ toSummary(); return; }
  if(transitioning) return; transitioning=true;
  const op=activePanel;
  if(op) op.classList.add('freeze');
  cur=k; sub=0; paused=false; stage.classList.remove('paused');
  // новая грань куба: справа при "вперёд", слева при "назад"
  const np=renderPanel(k,0);
  np.classList.add(dir==='next'?'right':'left');
  cube.appendChild(np);
  playVid(np);
  void cube.offsetWidth; // reflow
  let done=false;
  const finish=()=>{ if(done)return; done=true; transitioning=false;
    cube.classList.remove('anim','to-next','to-prev');
    if(op&&op.parentNode) op.remove();
    np.classList.remove('right','left','freeze'); np.classList.add('front');
    activePanel=np; wirePanel(np);
  };
  cube.classList.add('anim', dir==='next'?'to-next':'to-prev');
  cube.addEventListener('transitionend',finish,{once:true});
  setTimeout(finish,640);
}

const IDLE_MS=15000; let idleTimer=null; // авто-переход к след. букету только по долгому простою (фидбэк Макса №7)
// вместо навязчивого баннера — мягкий пульс существующей кнопки «Заказать»
function showEndCta(){ const b=activePanel&&activePanel.querySelector('.order'); if(b)b.classList.add('pulse'); }
function hideEndCta(){ document.querySelectorAll('.order.pulse').forEach(b=>b.classList.remove('pulse')); }
function clearIdle(){ if(idleTimer){clearTimeout(idleTimer);idleTimer=null;} }
function bouquetJump(delta){ if(transitioning)return; clearIdle(); hideEndCta(); views++; const k=(cur+delta+B.length)%B.length; transitionTo(k, delta>0?'next':'prev'); }
/* ручной тап-край — переходит к соседнему букету; авто-прогресс — нет */
function nextSub(){ if(transitioning)return; clearIdle(); hideEndCta(); if(sub<photosOf(cur).length-1) stepWithin(sub+1); else bouquetJump(1); }
function prevSub(){ if(transitioning)return; clearIdle(); hideEndCta(); if(sub>0) stepWithin(sub-1); else bouquetJump(-1); }
/* авто-прогресс: внутри букета листает фото; на последнем — НЕ прыгает, встаёт на паузу + показывает CTA, авто-переход лишь после долгого простоя */
function autoAdvance(){ if(transitioning)return; if(sub<photosOf(cur).length-1) stepWithin(sub+1); else pauseAtEnd(); }
function pauseAtEnd(){ clearIdle(); showEndCta(); idleTimer=setTimeout(()=>{ if(!sheetOpen&&!transitioning){ hideEndCta(); bouquetJump(1); } }, IDLE_MS); }

function toggleDesc(p){ const w=p.querySelector('.descwrap'); const open=w.classList.toggle('open'); open?pause():resume(); }
function pause(){ paused=true; stage.classList.add('paused'); const v=activePanel&&activePanel.querySelector('video'); if(v)v.pause(); }
function resume(){ if(!paused)return; paused=false; stage.classList.remove('paused'); if(activePanel)playVid(activePanel); }

/* Параллакс фото от наклона телефона / движения мыши — премиальная глубина */
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
let pOn=false;
function applyParallax(x,y){ if(REDUCED||!activePanel)return;
  const fg=activePanel.querySelector('.fg'), bg=activePanel.querySelector('.bg>img,.bg>video');
  if(fg) fg.style.transform=`translate(${x*5}px,${y*5}px) scale(1.05)`;
  if(bg) bg.style.transform=`translate(${x*16}px,${y*16}px) scale(1.12)`;
}
function onOrient(e){ if(e.gamma==null)return; const x=Math.max(-1,Math.min(1,e.gamma/28)); const y=Math.max(-1,Math.min(1,(e.beta-40)/28)); applyParallax(x,y); }
function enableParallax(){ if(pOn||REDUCED)return; pOn=true;
  if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(s=>{ if(s==='granted') window.addEventListener('deviceorientation',onOrient); }).catch(()=>{});
  } else if(window.DeviceOrientationEvent){ window.addEventListener('deviceorientation',onOrient); }
}
if(!REDUCED) window.addEventListener('mousemove',e=>{ applyParallax((e.clientX/innerWidth-.5)*1.2,(e.clientY/innerHeight-.5)*1.2); });

/* жесты: тап-половины + свайпы + hold-пауза */
let holdT=null, held=false, gx=0, gy=0, gMoved=false;
function onDown(e){ enableParallax(); clearIdle(); hideEndCta(); hideRailHint(); gx=e.clientX; gy=e.clientY; gMoved=false; held=false; holdT=setTimeout(()=>{ if(!gMoved){ held=true; pause(); } },180); }
function onMove(e){ if(Math.abs(e.clientX-gx)>10||Math.abs(e.clientY-gy)>10){ gMoved=true; clearTimeout(holdT); } }
function onUp(e){ clearTimeout(holdT); if(sheetOpen)return; if(held){ resume(); return; }
  const dx=e.clientX-gx, dy=e.clientY-gy;
  if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.2){ dx<0?bouquetJump(1):bouquetJump(-1); return; } // свайп влево=вперёд, вправо=назад
  const w=window.innerWidth||document.documentElement.clientWidth;
  (e.clientX < w/2) ? prevSub() : nextSub(); // тап: левая половина=назад по фото, правая=вперёд
}

function like(el){
  const s=st[cur];s.liked=!s.liked;el.classList.toggle('on',s.liked);
  el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
  likes+=s.liked?1:-1;document.getElementById('cnt').textContent=likes;
}

/* sheets */
const sheetEl=document.getElementById('sheet'),scrim=document.getElementById('scrim');
function openSheet(type){ sheetOpen=true; if(type==='size'||type==='similar')openedControl=true; hideRailHint(); pause(); sheet(type); }
function buyHTML(){
  const b=B[cur], c=curc(cur);
  return `<div class="pagehead"><button class="x" onclick="closeSheet()">${svg('<path d="M18 6 6 18M6 6l12 12"/>')}</button><h3>Оформление заказа</h3></div>
    <p class="sub">${b.name} · ${c.n} роз · ${c.cm} см</p>
    <div class="buyrow"><span>Букет</span><b>${rub(c.price)}</b></div>
    <div class="buyrow"><span>Доставка по Москве</span><b>~2 часа · бесплатно</b></div>
    <div class="delv">
      <button class="delopt sel" data-gift="0" onclick="selDeliv(this)">Знаю адрес — введу сам</button>
      <button class="delopt" data-gift="1" onclick="selDeliv(this)">Пусть укажет получатель (ссылка)</button>
    </div>
    <button class="buycta" onclick="orderDone()">Оформить · ${rub(c.price)}</button>
    <p class="fine">Оплата после подтверждения флористом · заказ исполняет Roza4U</p>`;
}
function selDeliv(el){ el.parentNode.querySelectorAll('.delopt').forEach(b=>b.classList.remove('sel')); el.classList.add('sel'); }
function orderDone(){
  const gift = sheetEl.querySelector('.delopt.sel')?.dataset.gift==='1';
  if(gift){
    sheetEl.innerHTML=`<div class="grip"></div><div class="done"><div class="okc">${svg(IC.check,'none','#fff')}</div><h3>Ссылка готова</h3><p class="sub" style="text-align:center">Отправьте её получателю — он сам укажет адрес и время. Адрес вам не покажем.<br><span style="opacity:.55">демо-прототип</span></p><a class="buycta" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box" href="recipient.html" target="_blank">Открыть страницу получателя</a><button class="buycta" style="background:rgba(255,255,255,.08);box-shadow:none;margin-top:10px" onclick="closeSheet()">Закрыть</button></div>`;
  } else {
    sheetEl.innerHTML=`<div class="grip"></div><div class="done"><div class="okc">${svg(IC.check,'none','#fff')}</div><h3>Заказ принят</h3><p class="sub" style="text-align:center">Флорист Roza4U подтвердит и доставит примерно за 2 часа.<br><span style="opacity:.55">демо-прототип</span></p><button class="buycta" onclick="closeSheet()">Готово</button></div>`;
  }
}
function sheet(type){
  const b=B[cur];let h='';
  if(type==='buy'){ sheetEl.innerHTML=buyHTML();sheetEl.classList.add('full','show');scrim.classList.add('show'); return; }
  if(type==='size'){
    const arr=cfgs(cur), sel=curc(cur);
    const heights=[...new Set(arr.map(c=>c.cm))].sort((a,b)=>a-b);
    const hSel=(st[cur]._h!=null && heights.includes(st[cur]._h))?st[cur]._h:sel.cm;
    const rowc=arr.filter(c=>c.cm===hSel).sort((a,b)=>a.n-b.n);
    h=`<div class="grip"></div><h3>Размер букета</h3><p class="sub">Честный размер, без «эконом/премиум». Число — предмет гордости.</p>`;
    if(heights.length>1){
      h+=`<div class="cfglabel">Высота</div><div class="chiprow">`+
        heights.map(cm=>`<button class="cfgchip ${cm===hSel?'sel':''}" onclick="setHeight(${cm})">${cm} см</button>`).join('')+`</div><div class="cfglabel">Сколько роз</div>`;
    }
    h+=`<div class="sizes">`+
      rowc.map(c=>{const isSel=(c.n===sel.n&&c.cm===sel.cm),off=Math.round((1-c.price/c.old)*100);
        return `<div class="sizeopt ${isSel?'sel':''}" onclick="setCfg(${c.n},${c.cm})"><div class="big">${c.n} <span>роз · ${c.cm} см · −${off}%</span></div><div class="row"><div class="p">${rub(c.price)}<small>${rub(c.old)}</small></div><div class="tick">${svg(IC.check,'none','#fff')}</div></div></div>`;}).join('')+`</div>`;
  }else if(type==='similar'){
    const others=B.map((bb,k)=>({bb,k})).filter(x=>!x.bb.hero && x.k!==cur && cfgs(x.k).length);
    h=`<div class="grip"></div><h3>Похожие букеты</h3><p class="sub">Не то? Полистай близкие варианты — тапни, чтобы открыть.</p><div class="simgrid">`+
      others.slice(0,8).map(x=>{const ph=x.bb.photos.find(p=>p.type!=='video')||x.bb.photos[0];const a=cfgs(x.k),cc=a[Math.floor((a.length-1)/2)];
        return `<button class="simcard" onclick="goTo(${x.k})"><img src="${ph.src}" alt=""><b>${x.bb.name}</b><span>${rub(cc.price)}</span></button>`;}).join('')+`</div>`;
  }else if(type==='about'){
    h=`<div class="grip"></div><h3>${b.name}</h3><p class="about">${b.desc}</p><div class="occ-title">Хорош для повода</div><div class="chips2">`+OCC.map(o=>`<span>${o}</span>`).join('')+`</div><button class="sheetcta" onclick="closeSheet()">Понятно</button>`;
  }else{
    const c=curc(cur), w=Math.round(c.cm*0.72), bud=b.bud||'Крупный';
    h=`<div class="grip"></div><h3>Состав и уход</h3><p class="sub">${b.name}, ${c.cm} см</p><div class="specs"><div><span>Высота</span><b>${c.cm} см</b></div><div><span>Ширина</span><b>~${w} см</b></div><div><span>Бутон</span><b>${bud}</b></div></div><ul class="compose">`+
      b.compose.map(c=>`<li><span class="ic">${svg(c.k==='leaf'?IC.leaf:c.k==='drop'?IC.drop:IC.gift)}</span>${c.t}<b>${c.v}</b></li>`).join('')+`</ul><button class="sheetcta" onclick="closeSheet()">Понятно</button>`;
  }
  sheetEl.innerHTML=h;sheetEl.classList.add('show');scrim.classList.add('show');
}
function closeSheet(){sheetEl.classList.remove('show','full');scrim.classList.remove('show');sheetOpen=false;resume();}
function swapPhotos(){ // фича B: пере-показать текущий букет с медиа выбранного размера
  const c=curc(cur); if(!activePanel||!(c&&c.photos&&c.photos.length))return;
  sub=0; activePanel.querySelector('.photo').innerHTML=mediaHTML(photosOf(cur)[0]); buildProg(); playVid(activePanel);
}
function setCfg(n,cm){ const a=cfgs(cur),j=a.findIndex(c=>c.n===n&&c.cm===cm); if(j>=0){st[cur].ci=j;st[cur]._h=cm; if(activePanel)fillPrice(activePanel,cur); swapPhotos();} sheet('size'); }
function setHeight(cm){ const a=cfgs(cur),c0=curc(cur),rowc=a.filter(c=>c.cm===cm).sort((x,y)=>x.n-y.n);
  const pick=rowc.reduce((p,c)=>Math.abs(c.n-c0.n)<Math.abs(p.n-c0.n)?c:p,rowc[0]);
  const j=a.indexOf(pick); if(j>=0)st[cur].ci=j; st[cur]._h=cm; if(activePanel)fillPrice(activePanel,cur); swapPhotos(); sheet('size'); }
function goTo(k){ closeSheet(); if(k===cur||transitioning)return; transitionTo(k, k>cur?'next':'prev'); }

/* summary */
function toSummary(){
  paused=true;stage.classList.add('paused');
  const v=activePanel&&activePanel.querySelector('video');if(v)v.pause();
  const liked=B.map((b,i)=>st[i]&&st[i].liked?{b,i}:null).filter(Boolean);
  const t=document.getElementById('thumbs');
  if(liked.length){
    t.innerHTML=liked.slice(0,6).map(x=>`<img src="${(x.b.photos.find(p=>p.type!=='video')||x.b.photos[0]).src}" onclick="buyFromSummary(${x.i})">`).join('');
    document.getElementById('sumtext').innerHTML=`Ты отметил <span class="cnt">${liked.length}</span> ${plural(liked.length)}. Нажми на любой — оформим за пару минут.`;
  }else{ t.innerHTML=''; document.getElementById('sumtext').textContent='Листай истории и отмечай ♡ — здесь соберётся твой шорт-лист.'; }
  summaryEl.classList.add('show');
}
function buyFromSummary(i){ cur=i; openSheet('buy'); }
function goSum(){ const f=B.findIndex((b,i)=>st[i]&&st[i].liked); if(f>=0) buyFromSummary(f); else restart(); }
const plural=n=>(n%10==1&&n%100!=11)?'букет':((n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?'букета':'букетов');
function restart(){ transitioning=false; summaryEl.classList.remove('show'); cube.className='cube'; cube.innerHTML=''; cur=0; sub=0; paused=false; stage.classList.remove('paused'); const p=renderPanel(0,0); p.classList.add('front'); cube.appendChild(p); activePanel=p; wirePanel(p); }

document.addEventListener('visibilitychange',()=>{document.hidden?pause():(!sheetOpen&&resume())});

/* init */
(function(){ const p=renderPanel(0,0); p.classList.add('front'); cube.appendChild(p); activePanel=p; wirePanel(p); })();
</script>
</body>
