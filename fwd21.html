<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a09">
<title>МояРоза — SDR / HDR</title>
<style>
:root{--pink:#e0759a;--glass:rgba(18,14,13,.56);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0c0a09;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}button,a{font:inherit}.gallery{height:100dvh;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.gallery::-webkit-scrollbar{display:none}.frame{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:center;overflow:hidden;background:#0c0a09}.frame:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(10,7,6,.45),transparent 24%,transparent 57%,rgba(8,5,4,.88))}.media{width:100%;height:100%;object-fit:contain;display:block}.blur{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(32px) brightness(.42) saturate(1.15)}.media{position:relative;z-index:1}.top{position:fixed;z-index:10;left:16px;right:16px;top:calc(var(--safe-top) + 12px);display:flex;justify-content:space-between;align-items:center}.brand{font:italic 21px Georgia,serif;text-shadow:0 2px 14px #000}.back{color:#fff;text-decoration:none;font-size:13px;padding:9px 12px;border:1px solid #ffffff26;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px)}.switch{position:fixed;z-index:10;left:50%;top:calc(var(--safe-top) + 58px);transform:translateX(-50%);display:flex;padding:3px;border:1px solid #ffffff29;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px)}.switch button{border:0;background:transparent;color:#ffffffa8;border-radius:999px;padding:9px 18px;font-weight:700;font-size:13px}.switch button.on{background:#fff;color:#171210}.badge{position:fixed;z-index:9;right:16px;top:calc(var(--safe-top) + 111px);padding:7px 10px;border-radius:999px;border:1px solid #ffffff29;background:var(--glass);backdrop-filter:blur(16px);font-size:10px;letter-spacing:.06em}.meta{position:absolute;z-index:4;left:18px;right:18px;bottom:calc(var(--safe-bottom) + 22px);text-shadow:0 2px 14px #000}.counter{font-size:11px;opacity:.68;letter-spacing:.13em;text-transform:uppercase}.meta h1{font:600 28px/1.05 Georgia,serif;margin:8px 0}.meta p{font-size:13px;line-height:1.4;opacity:.78;max-width:340px}.progress{position:fixed;z-index:10;left:18px;right:18px;bottom:calc(var(--safe-bottom) + 12px);display:flex;gap:5px}.progress i{height:3px;flex:1;border-radius:5px;background:#ffffff42}.progress i.on{background:#fff}.play{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border:1px solid #ffffff48;border-radius:50%;background:#0005;color:#fff;backdrop-filter:blur(12px);font-size:21px}.play.playing{opacity:0}.notice{position:fixed;z-index:20;left:50%;bottom:calc(var(--safe-bottom) + 58px);transform:translate(-50%,15px);white-space:nowrap;padding:10px 14px;border-radius:999px;background:#fff;color:#191310;font-size:12px;opacity:0;transition:.2s}.notice.show{opacity:1;transform:translate(-50%,0)}@media(min-width:700px){body{background:#ded3cb}.gallery{max-width:470px;margin:auto;box-shadow:0 0 80px #0005}.top,.progress{max-width:438px;margin:auto}.switch{left:50%}}
</style>
</head>
<body>
<div class="top"><a class="back" href="./">← Лента</a><div class="brand">МояРоза</div></div>
<div class="switch" role="group" aria-label="Динамический диапазон"><button id="sdr" class="on">SDR</button><button id="hdr">HDR</button></div>
<div class="badge" id="badge">SDR · BT.709</div>
<main class="gallery" id="gallery">
  <section class="frame" data-kind="video"><video class="blur" muted loop playsinline></video><video class="media" muted loop playsinline preload="metadata"></video><button class="play" aria-label="Воспроизвести">▶</button><div class="meta"><div class="counter">01 · видео</div><h1>Розовые розы с эвкалиптом</h1><p>Один и тот же ролик в SDR и HDR10. Переключайте режим сверху.</p></div></section>
  <section class="frame" data-kind="image" data-name="IMG_7727"><img class="blur" alt=""><img class="media" alt="Букет розовых роз с эвкалиптом, фотография 1"><div class="meta"><div class="counter">02 · фотография</div><h1>В руках</h1><p>Натуральный масштаб букета и оттенок упаковки.</p></div></section>
  <section class="frame" data-kind="image" data-name="IMG_7729"><img class="blur" alt=""><img class="media" alt="Букет розовых роз с эвкалиптом, фотография 2"><div class="meta"><div class="counter">03 · фотография</div><h1>Крупный план</h1><p>Листайте вбок, чтобы сравнить детали.</p></div></section>
</main>
<div class="progress" id="progress"><i class="on"></i><i></i><i></i></div><div class="notice" id="notice"></div>
<script>
const gallery=document.getElementById('gallery'),badge=document.getElementById('badge'),notice=document.getElementById('notice'),buttons={sdr:document.getElementById('sdr'),hdr:document.getElementById('hdr')},frames=[...document.querySelectorAll('.frame')],dots=[...document.querySelectorAll('.progress i')];
let mode='sdr';const hi=matchMedia('(dynamic-range: high)').matches;
function srcFor(frame){if(frame.dataset.kind==='video')return `media/fwd21/IMG_7731-${mode==='hdr'?'hdr10':'sdr'}.mp4`;const name=frame.dataset.name;return `media/fwd21/${name}${mode==='hdr'?'-hdr.avif':'.jpg'}`}
function setMode(next){mode=next;buttons.sdr.classList.toggle('on',mode==='sdr');buttons.hdr.classList.toggle('on',mode==='hdr');badge.textContent=mode==='hdr'?'HDR10 · BT.2020 · PQ':'SDR · BT.709';frames.forEach(frame=>{const src=srcFor(frame);frame.querySelectorAll('video,img').forEach(el=>{el.src=src;if(el.tagName==='VIDEO')el.load()})});if(mode==='hdr'&&!hi){notice.textContent='Экран не сообщил поддержку HDR — показ может быть SDR';notice.classList.add('show');setTimeout(()=>notice.classList.remove('show'),2800)}}
buttons.sdr.onclick=()=>setMode('sdr');buttons.hdr.onclick=()=>setMode('hdr');
document.querySelector('.play').onclick=e=>{const vids=e.currentTarget.parentElement.querySelectorAll('video');if(vids[1].paused){vids.forEach(v=>v.play().catch(()=>{}));e.currentTarget.classList.add('playing')}else{vids.forEach(v=>v.pause());e.currentTarget.classList.remove('playing')}};
frames[0].querySelector('.media').addEventListener('click',()=>document.querySelector('.play').click());
new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.6){const i=frames.indexOf(e.target);dots.forEach((d,j)=>d.classList.toggle('on',i===j))}}),{root:gallery,threshold:[.6]}).observe(frames[0]);
const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.6){const i=frames.indexOf(e.target);dots.forEach((d,j)=>d.classList.toggle('on',i===j))}}),{root:gallery,threshold:[.6]});frames.slice(1).forEach(f=>io.observe(f));setMode('sdr');
</script>
</body></html>
